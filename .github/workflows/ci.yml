name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: xiff "$GITHUB_WORKSPACE/examples/robot_garden.xiff" robot_garden.png
      - name: Render all examples
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import xiff

          with tempfile.TemporaryDirectory() as tmp:
              for index, source in enumerate(sorted(Path("examples").rglob("*.xiff"))):
                  xiff.render_file(source, Path(tmp) / f"{index}.png")
                  print(f"Rendered {source}")
          PY
