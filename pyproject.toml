[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiff"
version = "0.1.0"
description = "A small intent-geometry language that renders directly to PNG."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "XIFF contributors" }
]
license = { text = "MIT" }
keywords = ["graphics", "geometry", "png", "generative-art", "vector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jugert-mucoimaj/xiff"
Repository = "https://github.com/jugert-mucoimaj/xiff"
Issues = "https://github.com/jugert-mucoimaj/xiff/issues"

[project.scripts]
xiff = "xiff.cli:main"

[tool.setuptools]
py-modules = ["engine"]
packages = ["xiff"]
